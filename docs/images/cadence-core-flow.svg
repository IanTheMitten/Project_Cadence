<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">How the Cadence core turns an event into an action</title>
  <desc id="d">An event from a peer is submitted one turn at a time under TURN_LOCK, then decided (Jev first, LLM if unsure), resolved to target devices, and executed as a call to the owning peer. Schedules feed submit; context and the capability catalogue feed decide; every decision goes to the decision log.</desc>
  <defs>
    <radialGradient id="halo" cx="640" cy="280" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2A646" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#F2A646" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#F2A646" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6B4A1F" flood-opacity="0.10"/>
    </filter>
    <marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#E9952F"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6A7080" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 21px; font-weight: 600; fill: #1F2638; }
      .h2 { font-size: 16px; font-weight: 600; fill: #1F2638; }
      .code { font-size: 13px; fill: #9A5200; }
      .sub { font-size: 14px; fill: #4E566A; }
      .card { fill: #FFFFFF; stroke: #E6DCCB; stroke-width: 1.5; }
      .side { fill: #F6EFE4; stroke: #DDD1BD; stroke-width: 1.5; }
      .thread { fill: none; stroke: #E9952F; stroke-width: 3; }
      .feed { fill: none; stroke: #6A7080; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1280" height="500" rx="24" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="1278.5" height="498.5" rx="23.5" fill="none" stroke="#E8DECD" stroke-width="1.5"/>
  <circle cx="640" cy="280" r="260" fill="url(#halo)"/>

  <text x="48" y="58" class="mono" font-size="13" fill="#9A5200" letter-spacing="2">CORE</text>
  <text x="48" y="92" class="sans" font-size="28" font-weight="600" fill="#1F2638">One event, one decision</text>

  <!-- the thread between stages -->
  <g>
    <path class="thread" d="M230 280 L252 280" marker-end="url(#warm)"/>
    <path class="thread" d="M440 280 L472 280" marker-end="url(#warm)"/>
    <path class="thread" d="M800 280 L832 280" marker-end="url(#warm)"/>
    <path class="thread" d="M1010 280 L1042 280" marker-end="url(#warm)"/>
  </g>

  <!-- feeds -->
  <path class="feed" d="M350 390 L350 336" marker-end="url(#ink)"/>
  <path class="feed" d="M560 390 L560 336" marker-end="url(#ink)"/>
  <path class="feed" d="M725 390 L725 336" marker-end="url(#ink)"/>
  <path class="feed" d="M640 230 L640 182" marker-end="url(#ink)"/>

  <!-- stages -->
  <g filter="url(#lift)">
    <rect x="40" y="230" width="190" height="100" rx="18" class="card"/>
    <rect x="260" y="230" width="180" height="100" rx="18" class="card"/>
    <rect x="840" y="230" width="170" height="100" rx="18" class="card"/>
    <rect x="1050" y="230" width="190" height="100" rx="18" class="card"/>
  </g>
  <rect x="480" y="230" width="320" height="100" rx="18" fill="#F2A646" opacity="0.5" filter="url(#glow)"/>
  <rect x="480" y="230" width="320" height="100" rx="18" fill="#FFFDF9" stroke="#E9952F" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="135" y="268" class="sans h">Event</text>
    <text x="135" y="292" class="sans sub">utterance from a peer</text>
    <text x="135" y="314" class="mono code">events.py</text>

    <text x="350" y="268" class="sans h">Submit</text>
    <text x="350" y="292" class="sans sub">one turn at a time</text>
    <text x="350" y="314" class="mono code">TURN_LOCK</text>

    <text x="640" y="268" class="sans h">Decide</text>
    <text x="640" y="292" class="sans sub">Jev first, LLM if unsure</text>
    <text x="640" y="314" class="mono code">deciders/</text>

    <text x="925" y="268" class="sans h">Resolve</text>
    <text x="925" y="292" class="sans sub">pick target devices</text>
    <text x="925" y="314" class="mono code">resolver.py</text>

    <text x="1145" y="268" class="sans h">Execute</text>
    <text x="1145" y="292" class="sans sub">call the owning peer</text>
    <text x="1145" y="314" class="mono code">executor.py</text>
  </g>

  <!-- output above decide -->
  <rect x="530" y="118" width="220" height="64" rx="14" class="side"/>
  <g text-anchor="middle">
    <text x="640" y="144" class="sans h2">decision log</text>
    <text x="640" y="166" class="sans sub">every decision, plus labels</text>
  </g>

  <!-- inputs below -->
  <rect x="260" y="390" width="180" height="64" rx="14" class="side"/>
  <rect x="480" y="390" width="160" height="64" rx="14" class="side"/>
  <rect x="650" y="390" width="150" height="64" rx="14" class="side"/>
  <g text-anchor="middle">
    <text x="350" y="416" class="sans h2">schedules</text>
    <text x="350" y="438" class="mono code">Core.run_schedules</text>
    <text x="560" y="416" class="sans h2">context</text>
    <text x="560" y="438" class="sans sub">now playing, recent</text>
    <text x="725" y="416" class="sans h2">catalogue</text>
    <text x="725" y="438" class="sans sub">peer abilities</text>
  </g>
</svg>
