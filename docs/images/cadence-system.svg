<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="t d">
  <title id="t">How the pieces of Cadence connect</title>
  <desc id="d">The speaker board streams audio to the speaker adapter over /session. The speaker adapter, the Muse adapter, the chat page and the ceiling lamp all join the Cadence core over the /peer WebSocket. The core asks Jev first and escalates to a Google AI Studio LLM, writes every decision to a SQLite decision log, and the Muse adapter talks HTTP to the Muse library.</desc>
  <defs>
    <radialGradient id="halo" cx="645" cy="445" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2A646" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#F2A646" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F2A646" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6B4A1F" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8F9C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 19px; font-weight: 600; fill: #1F2638; }
      .code { font-size: 13px; fill: #9A5200; }
      .sub { font-size: 14px; fill: #4E566A; }
      .lab { font-size: 12px; fill: #6A7080; }
      .card { fill: #FFFFFF; stroke: #E6DCCB; stroke-width: 1.5; }
      .peer { fill: none; stroke: #E9952F; stroke-width: 3; stroke-linecap: round; }
      .peerglow { fill: none; stroke: #F2A646; stroke-width: 9; opacity: 0.35; }
      .audio { fill: none; stroke: #5E9BD6; stroke-width: 3; stroke-linecap: round; }
      .other { fill: none; stroke: #8A8F9C; stroke-width: 1.6; stroke-dasharray: 5 5; stroke-linecap: round; }
      .beat-w { fill: #E9952F; }
      .beat-c { fill: #5E9BD6; }
    </style>
  </defs>

  <rect width="1280" height="820" rx="24" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="1278.5" height="818.5" rx="23.5" fill="none" stroke="#E8DECD" stroke-width="1.5"/>

  <!-- heading + legend -->
  <text x="48" y="58" class="mono" font-size="13" fill="#9A5200" letter-spacing="2">SYSTEM</text>
  <text x="48" y="92" class="sans" font-size="28" font-weight="600" fill="#1F2638">How the pieces connect</text>

  <g class="sans" font-size="13" fill="#4E566A">
    <line x1="700" y1="74" x2="736" y2="74" class="peer"/>
    <text x="746" y="79">/peer WebSocket</text>
    <line x1="884" y1="74" x2="920" y2="74" class="audio"/>
    <text x="930" y="79">audio PCM</text>
    <line x1="1034" y1="74" x2="1070" y2="74" class="other"/>
    <text x="1080" y="79">HTTP, API, browser</text>
  </g>

  <!-- home server region -->
  <rect x="330" y="140" width="630" height="640" rx="28" fill="#F6EFE4" stroke="#DDD1BD" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="356" y="174" class="mono" font-size="12" fill="#9A5200" letter-spacing="1.5">HOME SERVER · ianshomeserver</text>

  <circle cx="645" cy="445" r="230" fill="url(#halo)"/>

  <!-- links (drawn under cards) -->
  <g>
    <!-- peers into the core -->
    <path class="peerglow" filter="url(#glow)" d="M495 318 C495 360 585 352 590 395"/>
    <path class="peer" d="M495 318 C495 360 585 352 590 395"/>
    <path class="peerglow" filter="url(#glow)" d="M795 318 C795 360 705 352 700 395"/>
    <path class="peer" d="M795 318 C795 360 705 352 700 395"/>
    <path class="peerglow" filter="url(#glow)" d="M495 620 C495 575 585 565 590 505"/>
    <path class="peer" d="M495 620 C495 575 585 565 590 505"/>
    <path class="peerglow" filter="url(#glow)" d="M250 432 C390 432 400 450 515 450"/>
    <path class="peer" d="M250 432 C390 432 400 450 515 450"/>
    <!-- core to decision log -->
    <path d="M700 505 C700 560 795 565 795 620" fill="none" stroke="#4E566A" stroke-width="1.8" marker-end="url(#arrow)"/>
    <!-- audio -->
    <path class="audio" d="M250 258 L370 258"/>
    <!-- other links -->
    <path class="other" d="M250 652 L370 664" marker-end="url(#arrow)"/>
    <path class="other" d="M920 250 L1008 250" marker-end="url(#arrow)"/>
    <path class="other" d="M775 425 C890 425 900 437 1008 437" marker-end="url(#arrow)"/>
    <path class="other" d="M775 475 C890 475 900 592 1008 592" marker-end="url(#arrow)"/>
  </g>

  <!-- link labels -->
  <text x="310" y="246" text-anchor="middle" class="mono lab">/session</text>
  <text x="310" y="280" text-anchor="middle" class="sans lab">audio both ways</text>
  <text x="380" y="424" text-anchor="middle" class="sans lab">lamp joins /peer directly</text>
  <text x="310" y="642" text-anchor="middle" class="mono lab">/ws</text>
  <text x="964" y="240" text-anchor="middle" class="sans lab">HTTP</text>
  <text x="900" y="414" text-anchor="middle" class="sans lab">decides first</text>
  <text x="905" y="578" text-anchor="end" class="sans lab">on escalation</text>

  <!-- boards and browser (left) -->
  <text x="48" y="174" class="mono" font-size="12" fill="#9A5200" letter-spacing="1.5">ESP32-S3 BOARDS</text>
  <g filter="url(#lift)">
    <rect x="40" y="200" width="210" height="112" rx="16" class="card"/>
    <rect x="40" y="380" width="210" height="112" rx="16" class="card"/>
    <rect x="40" y="600" width="210" height="112" rx="16" class="card"/>
  </g>
  <text x="60" y="236" class="sans h">speaker board</text>
  <text x="60" y="260" class="mono code">voice_chat/</text>
  <text x="60" y="290" class="sans sub">mic + I2S amp</text>

  <text x="60" y="416" class="sans h">ceiling lamp</text>
  <text x="60" y="440" class="mono code">lamp/</text>
  <text x="60" y="470" class="sans sub">cool + warm LEDs</text>

  <text x="60" y="636" class="sans h">browser tab</text>
  <text x="60" y="660" class="mono code">on the tailnet</text>
  <text x="60" y="690" class="sans sub">type to Cadence</text>

  <!-- server cards -->
  <g filter="url(#lift)">
    <rect x="370" y="200" width="250" height="118" rx="16" class="card"/>
    <rect x="670" y="200" width="250" height="118" rx="16" class="card"/>
    <rect x="370" y="620" width="250" height="118" rx="16" class="card"/>
    <rect x="670" y="620" width="250" height="118" rx="16" class="card"/>
  </g>
  <text x="390" y="236" class="sans h">speaker adapter</text>
  <text x="390" y="260" class="mono code">cadence_speaker · :8768</text>
  <text x="390" y="286" class="sans sub">wake word, VAD, ASR, TTS</text>
  <text x="390" y="306" class="sans lab">device peer, room bedroom</text>

  <text x="690" y="236" class="sans h">muse adapter</text>
  <text x="690" y="260" class="mono code">cadence_muse</text>
  <text x="690" y="286" class="sans sub">music queues, streams</text>
  <text x="690" y="306" class="sans lab">service peer</text>

  <text x="390" y="656" class="sans h">chat</text>
  <text x="390" y="680" class="mono code">cadence_chat · :8771</text>
  <text x="390" y="706" class="sans sub">text in, replies out</text>
  <text x="390" y="726" class="sans lab">one device peer per tab</text>

  <text x="690" y="656" class="sans h">decision log</text>
  <text x="690" y="680" class="mono code">cadence.sqlite3</text>
  <text x="690" y="706" class="sans sub">every decision</text>
  <text x="690" y="726" class="sans lab">labelled by spoken corrections</text>

  <!-- the core -->
  <rect x="515" y="385" width="260" height="130" rx="20" fill="#F2A646" opacity="0.5" filter="url(#glow)"/>
  <rect x="515" y="385" width="260" height="130" rx="20" fill="#FFFDF9" stroke="#E9952F" stroke-width="2"/>
  <text x="645" y="426" text-anchor="middle" class="sans" font-size="23" font-weight="600" fill="#1F2638">cadence core</text>
  <text x="645" y="452" text-anchor="middle" class="mono code">harness · /peer :8770</text>
  <text x="645" y="480" text-anchor="middle" class="sans sub">decide, resolve, execute</text>
  <text x="645" y="500" text-anchor="middle" class="sans lab">knows nothing about audio</text>

  <!-- beats at link ends -->
  <g class="beat-w">
    <circle cx="495" cy="318" r="4.5"/><circle cx="590" cy="395" r="4.5"/>
    <circle cx="795" cy="318" r="4.5"/><circle cx="700" cy="395" r="4.5"/>
    <circle cx="495" cy="620" r="4.5"/><circle cx="590" cy="505" r="4.5"/>
    <circle cx="250" cy="432" r="4.5"/><circle cx="515" cy="450" r="4.5"/>
  </g>
  <g class="beat-c"><circle cx="250" cy="258" r="4.5"/><circle cx="370" cy="258" r="4.5"/></g>

  <!-- outside services (right) -->
  <text x="1016" y="174" class="mono" font-size="12" fill="#9A5200" letter-spacing="1.5">OUTSIDE</text>
  <g filter="url(#lift)">
    <rect x="1010" y="200" width="230" height="100" rx="16" class="card"/>
    <rect x="1010" y="387" width="230" height="100" rx="16" class="card"/>
    <rect x="1010" y="542" width="230" height="100" rx="16" class="card"/>
  </g>
  <text x="1030" y="236" class="sans h">Muse library</text>
  <text x="1030" y="260" class="mono code">:8080</text>
  <text x="1030" y="284" class="sans sub">tracks and audio</text>

  <text x="1030" y="423" class="sans h">Jev</text>
  <text x="1030" y="447" class="mono code">TypeSafe API</text>
  <text x="1030" y="471" class="sans sub">fast first decider</text>

  <text x="1030" y="578" class="sans h">Google AI Studio</text>
  <text x="1030" y="602" class="mono code">gemini-3.5-flash-lite</text>
  <text x="1030" y="626" class="sans sub">chat, hard cases</text>
</svg>
