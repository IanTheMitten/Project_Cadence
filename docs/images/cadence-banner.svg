<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Cadence</title>
  <desc id="d">Cadence logo: a glowing amber dot with cool blue arcs on the left and warm amber arcs on the right, next to the word cadence.</desc>
  <defs>
    <radialGradient id="room" cx="290" cy="180" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCE3BF"/>
      <stop offset="0.45" stop-color="#FBF1E3"/>
      <stop offset="1" stop-color="#FBF7F0"/>
    </radialGradient>
    <radialGradient id="halo" cx="290" cy="180" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2A646" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F2A646" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F2A646" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="284" cy="173" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE2B0"/>
      <stop offset="1" stop-color="#E58A1F"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#room)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="23.5" fill="none" stroke="#E8DECD" stroke-width="1.5"/>

  <!-- mark: one point of light; cool channel left, warm channel right -->
  <circle cx="290" cy="180" r="120" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <g stroke="#5E9BD6">
      <path d="M253.2 149.1 A48 48 0 0 0 253.2 210.9"/>
      <path d="M234.8 133.7 A72 72 0 0 0 234.8 226.3" opacity="0.7"/>
      <path d="M216.5 118.3 A96 96 0 0 0 216.5 241.7" opacity="0.45"/>
    </g>
    <g stroke="#E9952F">
      <path d="M326.8 149.1 A48 48 0 0 1 326.8 210.9"/>
      <path d="M345.2 133.7 A72 72 0 0 1 345.2 226.3" opacity="0.7"/>
      <path d="M363.5 118.3 A96 96 0 0 1 363.5 241.7" opacity="0.45"/>
    </g>
  </g>
  <circle cx="290" cy="180" r="24" fill="#F2A646" filter="url(#soft)" opacity="0.8"/>
  <circle cx="290" cy="180" r="20" fill="url(#bulb)"/>

  <!-- wordmark -->
  <text x="440" y="198" fill="#1F2638" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="-3">cadence</text>
  <text x="444" y="250" fill="#4E566A" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26">Home voice assistant. Listens, decides, remembers.</text>
  <text x="445" y="292" fill="#9A5200" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1">ESP32-S3 BOARDS  ·  PYTHON PEERS  ·  JEV + LLM  ·  DECISION LOG</text>
</svg>
